name: Deploy NetValue
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: NetValue commit SHA or trusted branch/tag to deploy
        type: string
        default: main
permissions:
  contents: read
  id-token: write
concurrency:
  group: netvalue-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_NAME: ${{ vars.AZURE_WEB_APP_NAME }}
      SQL_SERVER: ${{ vars.SQL_SERVER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JeffCousineau/NetValue
          ref: ${{ inputs.source_ref }}
          path: application
          persist-credentials: false
      - name: Check deployment prerequisites
        env:
          SQL_ACCESS_READY: ${{ vars.SQL_ACCESS_READY }}
        run: |
          test "$SQL_ACCESS_READY" = 'true'
          test -n "$APP_NAME"
          test -n "$SQL_SERVER"
          git -C application rev-parse HEAD
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: application/global.json
      - name: Verify and publish
        working-directory: application
        run: |
          dotnet run --project Tests/NetValue.Checks.csproj --configuration Release
          dotnet publish NetValue.csproj --configuration Release --output ../package --no-restore
          test ! -d ../package/App_Data
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - name: Synchronize app SQL firewall with Terraform
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: 'true'
          ARM_USE_AZUREAD: 'true'
        run: |
          terraform -chdir=app-access init -backend-config=backend.example.hcl -backend-config='use_oidc=true'
          terraform -chdir=app-access plan -out=reviewed.tfplan
          terraform -chdir=app-access apply reviewed.tfplan
      - name: Get the migration runner IPv4
        id: runner
        run: |
          runner_ip=$(curl --fail --silent --show-error https://api.ipify.org)
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$runner_ip"
          echo "ip=$runner_ip" >> "$GITHUB_OUTPUT"
      - name: Temporarily allow migration runner with Terraform
        id: firewall
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: 'true'
          TF_VAR_runner_ip: ${{ steps.runner.outputs.ip }}
          TF_VAR_rule_name: github-${{ github.run_id }}
        run: |
          terraform -chdir=runner-access init
          terraform -chdir=runner-access apply -auto-approve
      - name: Apply database schema migrations
        env:
          Database__Provider: SqlServer
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          export ConnectionStrings__NetValue="Server=tcp:${SQL_SERVER}.database.windows.net,1433;Database=NetValue;Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Pooling=False;"
          dotnet package/NetValue.dll --migrate-database
      - name: Remove migration runner access with Terraform
        if: always() && steps.firewall.outcome != 'skipped' && steps.runner.outcome == 'success'
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: 'true'
          TF_VAR_runner_ip: ${{ steps.runner.outputs.ip }}
          TF_VAR_rule_name: github-${{ github.run_id }}
        run: terraform -chdir=runner-access destroy -auto-approve
      - name: Check App Service availability
        run: |
          state=$(az webapp show --resource-group rg-netvalue-free --name "$APP_NAME" --query state --output tsv)
          if [ "$state" != 'Running' ]; then
            echo "App Service is $state. Check F1 quotas and retry after reset; do not upgrade to a paid tier."
            exit 1
          fi
      - name: Deploy tested package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME }}
          package: package
