name: Deploy NetValue
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: NetValue commit SHA or trusted branch/tag to deploy
        type: string
        default: main
permissions:
  contents: read
  id-token: write
concurrency:
  group: netvalue-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_NAME: ${{ vars.AZURE_WEB_APP_NAME }}
      SQL_SERVER: ${{ vars.SQL_SERVER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JeffCousineau/NetValue
          ref: ${{ inputs.source_ref }}
          path: application
          persist-credentials: false
      - name: Check deployment prerequisites
        env:
          SQL_ACCESS_READY: ${{ vars.SQL_ACCESS_READY }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: |
          test "$SQL_ACCESS_READY" = 'true'
          test -n "$APP_NAME"
          test -n "$SQL_SERVER"
          test -n "$ENTRA_CLIENT_SECRET"
          git -C application rev-parse HEAD
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: application/global.json
      - name: Verify and publish
        working-directory: application
        run: |
          dotnet run --project Tests/NetValue.Checks.csproj --configuration Release
          dotnet publish NetValue.csproj --configuration Release --output ../package --no-restore
          test ! -d ../package/App_Data
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Temporarily allow this migration runner
        id: firewall
        run: |
          runner_ip=$(curl --fail --silent --show-error https://api.ipify.org)
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$runner_ip"
          az sql server firewall-rule create --resource-group rg-netvalue-free --server "$SQL_SERVER" --name "github-${GITHUB_RUN_ID}" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" --output none
      - name: Apply database schema migrations
        env:
          Database__Provider: SqlServer
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          export ConnectionStrings__NetValue="Server=tcp:${SQL_SERVER}.database.windows.net,1433;Database=NetValue;Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Pooling=False;"
          dotnet package/NetValue.dll --migrate-database
      - name: Remove migration runner firewall access
        if: always() && steps.firewall.outcome == 'success'
        run: az sql server firewall-rule delete --resource-group rg-netvalue-free --server "$SQL_SERVER" --name "github-${GITHUB_RUN_ID}" --output none
      - name: Set the authentication secret outside Terraform
        env:
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: |
          secret_file=$(mktemp)
          trap 'rm -f "$secret_file"' EXIT
          SECRET_FILE="$secret_file" python3 -c 'import os,json; open(os.environ["SECRET_FILE"],"w").write(json.dumps({"Authentication__ClientSecret":os.environ["ENTRA_CLIENT_SECRET"]}))'
          az webapp config appsettings set --resource-group rg-netvalue-free --name "$APP_NAME" --settings "@$secret_file" --output none
      - name: Start App Service and check availability
        run: |
          az webapp start --resource-group rg-netvalue-free --name "$APP_NAME" --output none
          state=$(az webapp show --resource-group rg-netvalue-free --name "$APP_NAME" --query state --output tsv)
          if [ "$state" != 'Running' ]; then
            echo "App Service is $state. Check F1 quotas and retry after reset; do not upgrade to a paid tier."
            exit 1
          fi
      - name: Deploy tested package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME }}
          package: package
